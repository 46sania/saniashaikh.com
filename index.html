/* Layout: an editorial monograph on a grey desk. Left page is text (code, small caps, heavy sans heading), right page is one ink drawing on a tinted block with a 60-tick ruler. Wide screens turn leaves in 3D; phones swipe single pages. */
:root{

  --ph:min(calc(100vh - 90px),860px);

}

:root[data-theme="dark"]{--desk:#18181b;--desk-2:#0b0b0d;--chrome:#e9e9ec;--chrome-soft:#9b9ba3;--paper:#e9e9ea;--paper-2:#d8d8da;color-scheme:dark}

.book::before{content:"";position:absolute;left:2%;right:2%;bottom:-3%;height:6%;background:radial-gradient(closest-side,rgba(0,0,0,.4),transparent);filter:blur(9px);z-index:-1}

/* controls */
.nav{display:flex;align-items:center;gap:14px;font:400 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--chrome-soft)}

const PP=[
['Empathy','NOTICE / AWARE / CARE','Kindness is not about being soft. It is about being aware.',`This person taught me empathy.
Not just empathy towards people, but towards animals, pets, and nature.
They made me understand that love doesn’t always need words. Sometimes it is simply noticing that something is hungry, frightened, tired, lonely, or unable to speak for itself.
Perhaps that is where I learnt that kindness is not about being soft.
It is about being aware.`],
['Learning','TRY / FAIL / TRY AGAIN','Trying again. And eventually figuring out what I actually love.',`Who taught me the art of studying, learning and acquiring knowledge by myself.
They taught me about ambition, aspirations, education and knowledge—but also about trying.
Trying different things.
Making mistakes.
Changing direction.
Trying again.
And eventually figuring out what I actually love.
They also taught me something about being an educator:
You cannot teach someone by showing them how much you know.
You influence someone when you can take something complicated and break it down into small enough pieces for a complete amateur to understand.
That is when knowledge actually becomes powerful.`],
['Aestheticism','ART / DESIGN / IDENTITY','Some things are meant to be lived rather than displayed.',`Aestheticism combines art, design, and a philosophy of appreciating beauty.
This person taught me about art and design—not merely as professions, but as ways of living.
They showed me how aesthetics, creativity, principles, and personal identity can become part of everyday life.
But perhaps the bigger lesson was about owning who you are.
They also made me question something deeper about faith.
Not how much you show it.
Not how loudly you speak about it.
But how deeply you feel it.
I learnt that some things are meant to be lived rather than displayed.`],
['Automobiles','MACHINE / FORM / CURIOSITY','How does this work? Why was it made this way? Who thought of this?',`My grandfather.
He gave me my love for automobiles.
Perhaps it started with the machines themselves—the shapes, the sounds, the mechanisms, the details.
But looking back, I think it was also about fascination.
The ability to look at an object and wonder:
How does this work? Why was it made this way? Who thought of this?
That curiosity stayed.`],
['Gadgets','DEVICE / INTERFACE / DETAIL','Not simply for what it does, but for how it works.',`This person made me a gadget geek.
They taught me to be fascinated by technology—not simply for what it does, but for how it works.
New devices. New interfaces. New possibilities.
I learnt to notice the little things: the buttons, the materials, the sounds, the interaction, the experience.
Perhaps this was one of the earliest places where my love for technology and design began to overlap.`],
['Choosing a Path','ADVICE / DIRECTION / CAREER','One sentence, given at the right moment, can alter the architecture of an entire life.',`This person told me to pursue Industrial Product Design.
Sometimes another person sees a possibility in you before you see it yourself.
That advice became a direction.
And that direction became a career.
It is strange how one sentence, given at the right moment, can alter the architecture of an entire life.`],
['Speaking Up','HURT / SAY IT / OWN IT','Sometimes it is simply giving someone the information they need to treat you better.',`This person taught me that if something hurts, say it.
Even if it seems small.
Even if it is only one comment, one action, one little thing that someone may not even have realised was hurtful.
People are not always intentionally cruel.
Sometimes they simply don’t know.
And if they don’t know, they cannot correct it.
I learnt that speaking up is not always confrontation.
Sometimes it is simply giving someone the information they need to treat you better.
And perhaps more importantly, it is about owning your feelings instead of silently carrying them.`],
['Observation','SOUND / MOVEMENT / LIGHT','Most of us are simply moving too quickly to notice.',`My cat.
A tiny creature who taught me to slow down and observe.
Cats notice everything.
A sound.
A movement.
A change in light.
A person entering a room.
A bird outside a window.
Watching my cat taught me that observation is a skill.
The world is constantly giving us information.
Most of us are simply moving too quickly to notice.`],
['Taste','COMPOSITION / PROPORTION / RESTRAINT','Taste is difficult to teach. But it can be cultivated.',`This person taught me about taste.
Not just what looks beautiful, but why something feels beautiful.
Composition. Proportion. Restraint. Details.
The ability to walk into a space, look at an object, see an outfit, notice a photograph—and understand that something works even before you can explain why.
Taste is difficult to teach.
But it can be cultivated.`],
['Obsession','ALIGN / ORGANISE / PERFECT','It taught me something about precision.',`This person taught me about OCD.
Not necessarily as a diagnosis or a condition, but as an almost obsessive relationship with details.
The need to align things.
To organise.
To perfect.
To notice what others might overlook.
It taught me something about precision.
Sometimes what looks like an unnecessary detail to someone else is exactly what makes the whole thing feel right to you.`],
['Cooking Fast','CHOP / STIR / TASTE','Sometimes it simply needs to be made with attention.',`This person taught me how to cook quickly—and still make it delicious.
But somewhere along the way, cooking became more than a skill.
It became therapy.
There is something comforting about chopping, stirring, seasoning, tasting and creating something from almost nothing.
A meal doesn’t need to be elaborate.
Sometimes it simply needs to be made with attention.`],
['Being Rich','ENOUGH / SHARE / GENEROUS','Not simply to have money. But to have enough that you can share.',`This person taught me what it means to be rich.
Not simply to have money.
But to have enough that you can share.
To enjoy what you have.
To give without constantly calculating what you will lose.
To live generously.
To live a little like a king—not necessarily because you own a kingdom, but because you know how to make the people around you feel like they belong in one.`],
['Being Street Smart','READ / ROOM / OPPORTUNITY','Confidence can sometimes arrive after the action, not before it.',`This person taught me that intelligence isn’t always academic.
Sometimes you need to read a room.
Read a person.
Understand a situation.
Know when to speak and when to remain silent.
Know when to take the opportunity.
And sometimes—
fake it until you make it.
Confidence can sometimes arrive after the action, not before it.`],
['Protection','TRY / BELIEVE / DUA','When I succeed, their contribution exists inside that success too.',`This person taught me to protect the people I love.
To try, even when I am not sure I will succeed.
Because sometimes success is not only about what you gain.
It is about what your success means to the people who stood beside you.
Someone who cheered.
Someone who motivated.
Someone who helped.
Someone who gave advice.
Someone who simply believed.
Someone who made a dua.
I learnt that when I succeed, their contribution exists inside that success too.`],
['Being Presentable','CARRY / SPEAK / SIT','Elegance is not always about clothes.',`This person taught me how to behave in public.
How to carry myself.
How to speak.
How to sit at a table.
How to use table manners.
How to understand that the way you conduct yourself is part of the impression you leave behind.
Elegance is not always about clothes.
Sometimes it is simply knowing how to behave.`],
['Letting Go','FORGIVE / FORGET / MOVE ON','It means it doesn’t get to control what happens next.',`This person taught me something difficult:
Forgive.
Forget.
Move on.
Not everything deserves a permanent room in your mind.
Some things are meant to be lessons, not lifelong burdens.
Letting go doesn’t mean what happened didn’t matter.
It means it doesn’t get to control what happens next.`],
['Repair','BROKEN / FIGURE OUT / TRY AGAIN','The repaired object becomes more meaningful because you know the story of how it was saved.',`This person taught me to repair things.
Not immediately replace them.
There is something beautiful about fixing something that is broken.
Understanding how it came apart.
Figuring out what went wrong.
Trying again.
And sometimes discovering that the repaired object becomes more meaningful because you know the story of how it was saved.`],
['Selfless Love','UNCONDITIONAL / CHOSEN / GIVEN','Sometimes love, at its purest, is simply something you choose to give.',`This person taught me that love can be unconditional.
You can love someone even when they don’t love you back in the same way.
You can care without expecting an equal transaction.
Not because you are weak.
But because sometimes love, at its purest, is simply something you choose to give.`],
['Hibernation','SLEEP / RECOVER / RETURN','Sometimes the most productive thing you can do is absolutely nothing.',`This person taught me the art of sleeping.
Properly.
Without guilt.
There is something beautiful about disappearing from the world for a little while.
Sleeping.
Recovering.
Recharging.
Returning.
Sometimes the most productive thing you can do is absolutely nothing.`],
['Coffee','ORIGIN / ROAST / CULTURE','Even something as ordinary as a cup of coffee can have an entire world hidden inside it.',`This person introduced me to coffee.
But coffee became much more than a drink.
Its history.
Its origins.
Its cultures.
Its varieties.
The different ways people roast it, brew it, serve it and enjoy it.
I learnt that even something as ordinary as a cup of coffee can have an entire world hidden inside it.`],
['Exploring','PLACES / BOOKS / IDEAS','No syllabus. No teacher. No examination. Just curiosity.',`This person taught me to explore.
Places.
Books.
Ideas.
Skills.
Cultures.
Questions.
They taught me that some of the most valuable things you learn are the things you discover by yourself.
No syllabus.
No teacher.
No examination.
Just curiosity.`],
['Privacy','SOLITUDE / SPACE / SILENCE','Privacy is not loneliness.',`This person taught me that it is okay to disappear.
To step away from everyone.
To become unavailable for a while.
To keep certain things for yourself.
Privacy is not loneliness.
Sometimes solitude is simply the space where you hear yourself think again.`],
['Luxury','CRAFT / MATERIAL / THOUGHT','Luxury is often less about the price and more about the thought behind the object.',`This person taught me to appreciate luxury.
Not merely expensive things.
But craftsmanship.
Materials.
Details.
Design language.
Proportion.
History.
The feeling of something being made exceptionally well.
I learnt that luxury is often less about the price and more about the thought behind the object.`],
['Jugaad','IMPROVISE / ADAPT / MAKE DO','The real skill is knowing when to improvise and when a problem deserves a proper solution.',`Who taught me the art of jugaad.
The ability to find a way when the ideal solution isn’t available.
To work with what you have.
To improvise.
To adapt.
To look at a problem and ask, “How can I make this work?”
Sometimes, the budget is limited.
Sometimes, the tools aren’t right.
Sometimes, there is no time to wait for the perfect solution.
And sometimes, you simply have to figure it out.
I learnt that resourcefulness is a skill.
It requires observation, creativity and the willingness to experiment.
You look at what is available, understand what is possible and find a practical way forward.
But jugaad is not just about making something work temporarily.
There is a difference between a clever workaround and a solution that creates more problems later.
The real skill is knowing when to improvise and when a problem deserves a proper solution.
Because sometimes, limitations force you to think in ways you wouldn’t have considered otherwise.`],
['Living a Simple Life','ENOUGH / SMALL THINGS / CALM','Perhaps simplicity is not about having less. It is about knowing what is enough.',`Who taught me the art of living a simple life.
Not everything needs to be complicated.
Not everything needs to be expensive.
And not everything needs to be extraordinary to make you happy.
Sometimes, it is the little things.
A good meal.
A peaceful day.
A comfortable home.
People you love.
And the ability to enjoy what you already have instead of constantly chasing what you don’t.
Perhaps simplicity is not about having less.
It is about knowing what is enough.`],
['Unity and Variety','DIFFERENT / CONNECTED / BELONG','Unity doesn’t mean uniformity.',`Who taught me the art of unity and variety.
How different things can come together and still work beautifully.
Different personalities.
Different opinions.
Different ideas.
Different colours, forms and elements.
Everything doesn’t have to be the same to belong together.
Sometimes, it is the differences that make the whole thing interesting.
I learnt that unity doesn’t mean uniformity.
It means finding a connection between things that are different and making them feel like they belong.`],
['Music','EXPERIENCE / CULTURE / COMMUNITY','Sometimes, one introduction can open the door to an entire world.',`Who introduced me to the world of music and, along with it, Burning Man.
A world I might not have discovered in quite the same way on my own.
They taught me that music is not just something you listen to.
It can be an experience.
A culture.
A community.
A way of expressing yourself.
And sometimes, an introduction to an entirely different way of looking at life.
I learnt that music can bring strangers together, create memories with people you may never meet again, and make you feel part of something much bigger than yourself.
Sometimes, one introduction can open the door to an entire world.`],
['Books','READ / COLLECT / DISCOVER','And sometimes, the right book finds you at exactly the right time.',`Who taught me the art of books.
The joy of reading, collecting books, acquiring knowledge and discovering ideas that might never have crossed my mind otherwise.
Books allow you to enter someone else’s world without having to leave your own.
You can learn from people who lived centuries ago.
Understand perspectives you have never experienced.
Explore subjects you know absolutely nothing about.
And sometimes find answers to questions you didn’t even know you had.
I learnt that a book doesn’t always end when you reach the last page.
Sometimes, an idea stays with you for years.
Sometimes, a single sentence changes the way you think.
And sometimes, the right book finds you at exactly the right time.`],
['Games','STRATEGY / PATIENCE / PLAY','And sometimes, the best part isn’t even winning. It is the experience of playing.',`Who introduced me to the art of games.
The fun of playing, the thrill of winning, the frustration of losing and the satisfaction of figuring something out.
Games can teach you strategy, patience, observation and the ability to think a few steps ahead.
They make you understand that every move has consequences.
Sometimes you win because you planned well.
Sometimes you lose because you overlooked something obvious.
And sometimes, no matter how much you prepare, luck decides to play its part.
But games also remind you that not everything has to be serious.
Sometimes you can spend hours trying to beat a level, solve a puzzle or defeat someone simply because it is fun.
And sometimes, the best part isn’t even winning.
It is the experience of playing.`],
['Listening','HEAR / REMEMBER / MAKE SPACE','Remember the little things they tell you.',`Who taught me the art of listening.
Someone who listened to everything.
How my day went.
What happened at work.
What made me happy.
What upset me.
My passions.
My dreams.
My ambitions.
The random things I wanted to share and the things I couldn’t stop talking about.
Someone who made space for all of it.
I learnt that listening isn’t just about hearing someone speak.
It is about being interested in their world, even when that world is completely different from yours.
Sometimes, people don’t need you to solve their problems.
They just need someone who genuinely wants to know how their day went.
And perhaps one of the simplest ways of making someone feel loved is to remember the little things they tell you.`]
];

PP.push(
['Giving and Helping','TIME / MONEY / KNOWLEDGE','Not every act of kindness needs an audience.',`Who taught me the art of giving and helping.
To offer what I can, when I can, without always expecting something in return.
Sometimes, helping means giving money.
Sometimes, it means giving your time.
Sometimes, it means sharing your knowledge, opening a door, offering advice or simply showing up when someone needs you.
Not every act of kindness needs an audience.
Not everything good you do needs to be announced.
I learnt that you don’t have to be extraordinarily rich or successful to make a difference in someone’s life.
Sometimes, what feels small to you can mean everything to someone else.
And if you have the ability to make something a little easier for another person, why wouldn’t you?`],
['Happiness','JOY / NOTICE / UNCERTAINTY','It is about noticing what is already good about it.',`Who taught me the art of happiness.
The ability to find joy in life without waiting for everything to be perfect.
Because there will always be something missing.
Something to achieve.
Something to fix.
Something to worry about.
If happiness depends on everything falling into place, perhaps we will spend our entire lives waiting for it.
I learnt that happiness can exist alongside uncertainty.
In a good conversation.
A favourite meal.
A new discovery.
A familiar face.
A quiet evening.
Sometimes, happiness isn’t about changing your entire life.
It is about noticing what is already good about it.`],
['Ignorance','IGNORE / FOCUS / PEACE','Not everything deserves access to your mind.',`Who taught me the art of ignorance.
Not ignorance as in refusing to learn or understand.
But the ability to ignore what doesn’t deserve my attention.
Every opinion doesn’t need a response.
Every argument doesn’t need my participation.
Every provocation doesn’t deserve my energy.
There will always be people who misunderstand you, judge you or have something to say about the way you live.
And sometimes, the most intelligent response is no response at all.
I learnt that knowing what to pay attention to is important.
But knowing what to ignore can be just as valuable.
Not everything deserves access to your mind.`],
['Carrying a Personality','PRESENCE / COMFORT / CHANGE','Perhaps the most interesting people are those who are still becoming themselves.',`Who taught me the art of carrying a personality.
To have a presence of my own.
To know what I like.
What I believe in.
What makes me laugh.
What I find interesting.
What I stand for.
And what makes me different from everyone else.
I learnt that having a personality isn’t about trying to be the most interesting person in the room.
It is about being comfortable enough with yourself that you don’t need to become someone else to be accepted.
You can be serious about some things and ridiculous about others.
You can be knowledgeable without pretending to know everything.
You can be confident without needing to prove it constantly.
And you can change your mind without losing yourself.
Perhaps the most interesting people are those who are still becoming themselves.`],
['Function','FORM / USE / PURPOSE','Beauty and purpose should work together.',`Who taught me the art of function.
That beauty isn’t enough if something doesn’t work.
An object can look extraordinary.
It can have beautiful proportions, expensive materials and the most carefully considered details.
But if it doesn’t do what it is supposed to do, something is missing.
I learnt to look beyond appearance.
How does it work?
Is it comfortable to use?
Does it solve the problem?
Does it make someone’s life easier?
Does every design decision have a reason?
This lesson goes beyond product design.
People, too, can look impressive from the outside, but what matters is how they function in the real world.
How they treat others.
How they show up.
How they handle responsibility.
Because ultimately, whether we are designing a product or building a life, beauty and purpose should work together.`],
['Affection','REMEMBER / CHECK IN / CARE','I thought of you. I remembered you. I care about you.',`Who taught me the art of affection.
The little ways of showing someone that they matter.
A hug.
A thoughtful message.
Remembering something they mentioned weeks ago.
Checking whether they reached home safely.
Sitting beside someone when they don’t feel like talking.
Sometimes, affection is loud.
Sometimes, it is quiet.
Sometimes, it is expressed through words.
And sometimes, it is simply doing something for someone because you know it will make them happy.
I learnt that affection doesn’t always require grand gestures.
It often lives in the smallest details.
The things that say, without saying it directly:
I thought of you.
I remembered you.
I care about you.
And perhaps the most beautiful thing is learning how to express affection in a way the other person can actually feel.`],
['Negotiating','LISTEN / FIRM / PATIENT','The trick is knowing the difference between compromising your position and compromising your principles.',`Who taught me the art of negotiating.
That getting what you want isn’t always about demanding it.
Sometimes, it is about listening.
Understanding what the other person wants.
Knowing what matters to you.
Recognising what you can compromise on and what you cannot.
I learnt that negotiation is not necessarily about defeating the other person.
It is about finding a way forward.
Sometimes you have to be firm.
Sometimes you have to be patient.
Sometimes you need to walk away.
And sometimes, the best deal is the one where both people feel that they have gained something valuable.
The trick is knowing the difference between compromising your position and compromising your principles.`],
['Keeping Secrets','TRUST / SAFE / RESPECT','Sometimes, keeping quiet is one of the clearest ways to show respect.',`Who taught me the art of keeping secrets like a vault.
That when someone trusts you with something personal, it is not yours to share.
Not for entertainment.
Not to impress someone.
Not to become the most interesting person in a conversation.
Some things are told to you because someone feels safe enough to tell you.
And that safety comes with responsibility.
I learnt that knowing something about someone doesn’t give you the right to reveal it.
You can know a person’s fears, mistakes, struggles and private experiences without turning them into stories for someone else.
Trust is built in conversations.
But it is also built in the conversations you choose not to have.
Sometimes, keeping quiet is one of the clearest ways to show respect.`],
['Hosting','WELCOME / NOTICE / BELONG','It is remembered for how people felt while they were there.',`Who taught me the art of hosting.
How to welcome people into a space and make them feel comfortable being there.
It isn’t just about preparing food, arranging a table or making sure everything looks beautiful.
It is about thinking of the people who are going to arrive.
What will they need?
Will they feel included?
Will they have something to eat?
Will they have someone to talk to?
Will they feel comfortable enough to be themselves?
I learnt that good hosting is a combination of preparation, generosity and attention.
You notice the little things before someone has to ask.
You make room for people.
You bring different personalities together.
And you create an environment where everyone feels like they belong.
Because a beautiful gathering isn’t remembered only for what was served.
It is remembered for how people felt while they were there.`],
['Collecting','CURIOUS / KEEP / STORY','A record of your interests, your discoveries and the person you were when you found each piece.',`Who taught me the art of collecting.
The joy of finding something interesting and deciding it is worth keeping.
It could be books, gadgets, objects, photographs or something that most people would walk past without a second glance.
I learnt that collecting isn’t always about owning more.
Sometimes, it is about curiosity.
The story behind an object.
The reason it was made.
The details that make it different.
The memory of where you found it.
Over time, a collection becomes more than a group of objects.
It becomes a record of your interests, your discoveries and the person you were when you found each piece.
Perhaps we collect things because we want to keep a little part of the world that made us feel something.`],
['Dressing','COLOUR / SILHOUETTE / FIT','Clothes can communicate something before you have said a single word.',`Who taught me the art of dressing.
That what you wear can be a form of expression.
Clothes can communicate something before you have said a single word.
A colour.
A silhouette.
A fabric.
A fit.
A detail that seems insignificant until you notice it.
I learnt that dressing well isn’t necessarily about following trends or wearing expensive brands.
It is about understanding what works for you.
What makes you feel comfortable.
What reflects your personality.
What suits the occasion.
And how different pieces can come together to create something that feels intentional.
Sometimes, getting dressed is simply practical.
Sometimes, it is creative.
And sometimes, it is a way of showing the world a little more of who you are.`],
['Minimalism','REMOVE / KEEP / MAKE SPACE','Sometimes, clarity comes from removing things rather than adding more.',`Who taught me the art of minimalism.
The beauty of having less, but being more intentional about what remains.
Removing what isn’t necessary.
Keeping what serves a purpose.
Making space for what matters.
I learnt that minimalism isn’t simply about white walls, empty rooms or owning very few things.
It is about decisions.
Knowing what to include.
Knowing what to leave out.
Understanding when something adds value and when it only adds noise.
In design, every element should have a reason to exist.
Perhaps the same can be said about life.
Not every commitment needs to be accepted.
Not every possession needs to be acquired.
Not every thought needs to be entertained.
Sometimes, clarity comes from removing things rather than adding more.`],
['Grief','ABSENCE / MEMORY / CARRY','Moving forward doesn’t mean leaving someone behind.',`Who taught me the art of grief.
How to learn to live with someone who is no longer physically here.
There is no straightforward way to prepare yourself for the absence of someone who was once part of your everyday life.
Their voice.
Their presence.
The familiar things they did.
The conversations you thought you would have again.
And suddenly, there are memories where there used to be moments.
I learnt that grief isn’t something you simply finish and move on from.
Sometimes, you learn to carry it differently.
You find ways to remember.
You notice them in familiar places, old photographs, stories and little things that remind you of who they were.
Life continues, even when a part of yours feels as though it has stopped.
And slowly, you learn that moving forward doesn’t mean leaving someone behind.
Sometimes, it means finding a way to carry their love with you.`],
['Trust','CONSISTENT / HONEST / BRAVE','It is about allowing a relationship to exist without fear being in control of everything.',`Who taught me the art of trust.
The willingness to believe in someone without needing to control every outcome.
To allow people the space to be themselves.
To believe their words, while also paying attention to their actions.
I learnt that trust takes time to build.
It grows through consistency.
Through honesty.
Through keeping promises.
Through showing up when it matters.
But trust also requires a little courage.
Because no matter how carefully you choose someone, there is never a guarantee that you will never be disappointed.
And perhaps that is what makes trust meaningful.
You cannot build a genuine relationship while constantly expecting the other person to prove that they will never hurt you.
Trust is not about ignoring reality.
It is about allowing a relationship to exist without fear being in control of everything.`],
['Truth','HONEST / WRONG / REAL','But I learnt that the truth gives you something to work with.',`Who taught me the art of truth.
To be honest, even when it is uncomfortable.
To acknowledge what happened rather than creating a more convenient version of it.
To admit when I don’t know something.
To accept when I am wrong.
And to understand that the truth doesn’t always become easier simply because we avoid it.
Sometimes, honesty can create difficult conversations.
Sometimes, it can change relationships.
Sometimes, it forces you to confront something about yourself that you would rather not see.
But I learnt that the truth gives you something to work with.
You can correct a mistake.
You can make a better decision.
You can rebuild something on a more honest foundation.
Pretending may protect you for a moment.
But eventually, you have to live with what is real.`],
['Obsession','FASCINATION / DETAIL / INTENSITY','You improve because you cannot help trying again.',`Who taught me the art of obsession.
The ability to become completely fascinated by something.
To think about it when you wake up.
To research it when you should probably be doing something else.
To keep exploring long after everyone else has lost interest.
Sometimes, it is a subject.
Sometimes, it is a project.
Sometimes, it is a new skill, an object, a hobby or an idea that refuses to leave your mind.
I learnt that obsession can be a powerful source of knowledge.
You notice things others overlook because you have spent so much time looking.
You understand details because you keep asking questions.
You improve because you cannot help trying again.
But there is also a difference between being deeply interested in something and allowing it to consume everything else.
Perhaps the real skill is learning how to use that intensity without losing yourself in it.`],
['Simple Living, High Thinking','MODEST / AMBITIOUS / CURIOUS','You can live modestly without thinking small.',`Who taught me the art of simple living and high thinking.
That the way you live doesn’t have to be extravagant for your thoughts to be ambitious.
You can appreciate simple things and still dream of extraordinary possibilities.
You can live modestly without thinking small.
You can enjoy what you have while continuing to learn, question, imagine and grow.
I learnt that intelligence doesn’t need to be displayed through possessions.
And success doesn’t always need to be announced.
There is something powerful about being content with the simple things while keeping your mind open to bigger ideas.
To live without constantly needing to impress others.
To think beyond your immediate circumstances.
And to remember that the richness of a life cannot be measured only by what it owns.`],
['Gratitude','REMEMBER / THANK / PASS FORWARD','Gratitude is more than saying thank you. It is remembering.',`Who taught me the art of gratitude.
To remember the people who helped me get here.
The person who gave me an opportunity.
The person who encouraged me when I doubted myself.
The person who taught me something useful.
The person who stood beside me when things were difficult.
The person who offered advice that I understood only years later.
It is easy to look at where you are today and feel that you got there entirely through your own effort.
But when you look back carefully, you begin to notice how many people contributed along the way.
Some helped directly.
Some opened doors.
Some gave me the confidence to try.
Some simply believed in me when I wasn’t sure I could do it.
I learnt that gratitude is more than saying thank you.
It is remembering.
Remembering who helped.
Remembering what they gave.
And, when the opportunity comes, finding a way to pass that goodness forward.`],
['Photography','LIGHT / MOMENT / MEMORY','Some moments deserve our full attention.',`Who taught me the art of photography and collecting memories.
The ability to notice a moment and want to keep it.
A place.
A person.
A meal.
A journey.
A gathering.
An ordinary afternoon that might not seem important until years later.
I learnt that photography isn’t only about taking a beautiful picture.
It is about paying attention to what is happening around you.
The light.
The expression.
The details.
The feeling of being somewhere at a particular moment in time.
Photographs allow us to return to moments that would otherwise exist only in our memories.
They preserve faces, places and versions of ourselves that change as the years pass.
But perhaps the most important thing is remembering to experience life while documenting it.
Not every moment needs to be photographed.
Some moments deserve our full attention.
And sometimes, the best photograph is the one that reminds us how it felt to be there.`],
['Mentoring','GUIDE / ENCOURAGE / ALLOW','The goal is not to create another version of yourself.',`Who taught me the art of mentoring.
The difference between helping someone become better and trying to make them become you.
It is easy to give advice based on your own experiences.
To tell someone what worked for you.
To suggest the path you would have taken.
But another person’s journey is not necessarily supposed to look like yours.
I learnt that good mentoring begins with understanding the person in front of you.
Their strengths.
Their interests.
Their fears.
Their ambitions.
Their way of thinking.
Sometimes, people need guidance.
Sometimes, they need encouragement.
Sometimes, they need someone to challenge their assumptions.
And sometimes, they simply need the freedom to figure things out for themselves.
The goal is not to create another version of yourself.
It is to help someone discover what they are capable of becoming.`],
['Procrastination','DELAY / BEGIN / FIRST STEP','I am still learning that motivation doesn’t always arrive before action.',`Who taught me the art of procrastination.
Perhaps a chapter I shouldn’t be particularly proud of.
The ability to know exactly what needs to be done and somehow find seventeen other things to do instead.
A task that takes an hour suddenly becomes an entire day’s negotiation with myself.
First, coffee.
Then, perhaps a little research.
Maybe I should organise my desk.
Perhaps I need to think about the task a little more.
And before I know it, the deadline is much closer than it was when I started.
But procrastination has taught me something about myself.
Sometimes, I delay things because they feel overwhelming.
Sometimes, because I want them to be perfect.
Sometimes, because I simply don’t feel like doing them.
Knowing the difference matters.
I am still learning that motivation doesn’t always arrive before action.
Sometimes, you have to begin first.
Even if you begin badly.
Even if you begin reluctantly.
Even if all you manage is the first small step.`],
['Courage','STAND UP / TRY / WALK AWAY','Being courageous doesn’t mean you aren’t afraid.',`Who taught me the art of courage.
Standing up when it would be easier to stay quiet.
Trying when failure is a possibility.
Speaking when your voice feels uncertain.
Walking away when staying would be more comfortable.
I learnt that courage doesn’t always look dramatic.
Sometimes, it is a difficult conversation.
Sometimes, it is asking for an opportunity.
Sometimes, it is admitting that you need help.
Sometimes, it is choosing a different path when everyone expects you to continue on the one you started.
Being courageous doesn’t mean you aren’t afraid.
It means fear doesn’t get to make every decision for you.
And sometimes, the bravest thing you can do is simply take the next step without knowing exactly how everything will turn out.`],
['Apologising','ADMIT / ACKNOWLEDGE / CHANGE','Sometimes, two simple words can be difficult to say. I was wrong.',`Who taught me the art of apologising.
The ability to say, “I was wrong.”
Without immediately explaining why.
Without turning the conversation around.
Without making the other person feel responsible for what I did.
I learnt that apologising requires more than words.
It requires understanding what happened, acknowledging the impact and being willing to do better.
Sometimes, you may not have intended to hurt someone.
But your intentions do not automatically erase how your actions affected them.
A genuine apology allows you to take responsibility without treating every mistake as a verdict on your entire character.
You can be a good person and still get things wrong.
You can care about someone and still hurt them.
What matters is whether you are willing to acknowledge it, learn from it and change the behaviour.
Sometimes, two simple words can be difficult to say.
I was wrong.
But they can also be the beginning of making something right.`],
['Humour','LAUGH / RELEASE / TOGETHER','Sometimes, it is simply the ability to recognise the absurdity of being human.',`Who taught me the art of humour.
The ability to laugh when life gets ridiculous.
Because sometimes, things go wrong in ways that would be almost impressive if they weren’t happening to you.
Plans fail.
People misunderstand each other.
Technology stops working at the worst possible moment.
And somehow, the situation becomes funnier the more you try to control it.
I learnt that humour can make difficult moments a little easier to carry.
It can bring people together.
It can break the tension in a room.
It can help us look at ourselves without taking ourselves too seriously.
But humour also requires awareness.
There is a difference between laughing with someone and making someone the joke.
The best humour doesn’t always need a target.
Sometimes, it is simply the ability to recognise the absurdity of being human.
And to laugh at it together.`],
['Reinvention','CHANGE / OUTGROW / BEGIN AGAIN','Sometimes, growth means allowing yourself to change.',`Who taught me the art of reinvention.
The ability to become someone new without apologising for who I used to be.
We change.
Our interests change.
Our ambitions change.
Our understanding of the world changes.
Something that once felt like the perfect direction may eventually stop feeling right.
And sometimes, the person you worked so hard to become is no longer the person you want to be.
I learnt that changing direction doesn’t automatically mean the previous version of you was a mistake.
Perhaps that version gave you the experience, knowledge and confidence you needed to reach the next one.
You can outgrow a career.
Change your mind.
Discover a new passion.
Start again.
You don’t have to remain loyal to an old version of yourself simply because other people remember you that way.
Sometimes, growth means allowing yourself to change.`],
['Giving Gifts','REMEMBER / NOTICE / UNDERSTAND','The most meaningful gifts are often the ones that make someone feel understood.',`Who taught me the art of giving gifts.
That a thoughtful gift is not always about how much money you spend.
Sometimes, it is about remembering a passing comment someone made months ago.
Noticing something they love.
Finding something that reminds you of them.
Choosing something that feels personal rather than simply expensive.
I learnt that a gift can say many things.
I remembered.
I paid attention.
I know you.
I thought this might make you happy.
And perhaps that is what makes giving a gift so special.
You are not simply handing someone an object.
You are showing them that something about them stayed in your mind even when they weren’t around.
The most meaningful gifts are often the ones that make someone feel understood.`],
['Boundaries','NO / PEACE / SELF','I learnt that protecting my peace isn’t selfish.',`Who taught me the art of setting boundaries.
That being a good person doesn’t mean being available to everyone, all the time.
You can care about someone and still say no.
You can help someone without taking responsibility for everything they go through.
I learnt that protecting my peace isn’t selfish.
Not every request needs to be accepted, and not every expectation needs to be fulfilled.
Sometimes, boundaries are simply about caring for others without losing yourself in the process.`],
['Patience','TIME / PROGRESS / TRUST','Just because something isn’t happening yet doesn’t mean nothing is happening.',`Who taught me the art of patience.
That not everything happens when you want it to.
Learning takes time.
Trust takes time.
Building something meaningful takes time.
I learnt that just because something isn’t happening yet doesn’t mean nothing is happening.
Sometimes, progress is invisible.
Patience isn’t about sitting around and waiting for life to happen.
It is about doing your part and allowing things the time they need.`],
['Acceptance','RELEASE / REALITY / FORWARD','Sometimes, you have to stop arguing with reality and learn how to move forward.',`Who taught me the art of acceptance.
That not everything will happen the way I imagined it.
Some people will leave.
Some plans will fail.
Some questions will remain unanswered.
I learnt that acceptance doesn’t mean giving up.
It means understanding what I can change and what I cannot.
I can wish things had been different without spending my life trying to rewrite them.
Sometimes, you have to stop arguing with reality and learn how to move forward.`],
['______','UNNAMED / OPEN / ALWAYS BECOMING','Because we are always becoming.',`Some lessons haven’t found their name yet.
And perhaps that is the point.
There are still people I haven’t met.
Things I haven’t learnt.
Mistakes I haven’t made.
Places I haven’t explored.
And versions of myself that haven’t existed yet.
So perhaps this list should never really end.
Because we are always becoming.
And somewhere along the way, someone else will leave another little piece behind.`]
);

const PREF=["I don't think we become who we are entirely by ourselves.","There are pieces of other people everywhere in me.","Some taught me things intentionally. Some probably don't even know they taught me anything. Some gave me a habit. Some gave me a way of thinking. Some gave me a strange obsession. Some gave me a value.","And some simply showed me something once that never left.","I want to remember them—not necessarily by their names, but by the little pieces of myself that came from them."];

pages.push(()=>`<div class="page right p3"><i class="edge"></i><div class="scr">${scribble('#111113')}</div><div class="cap"><b>Fig. 00 — The people we carry</b></div><span class="pn">03</span></div>`);
pages.push(()=>`<div class="page left dark"><i class="edge"></i><div class="scr sm">${scribble('#eeeef0')}</div><div class="t pf"><div class="code">Before the pages</div><i class="dash"></i><h2>The People Who Made Me</h2><div class="body fit one">${paras(PREF)}</div></div><span class="pn">04</span></div>`);
pages.push(()=>`<div class="page right idx"><i class="edge"></i><div class="t"><div class="code">The people</div><i class="dash"></i><h2>PEOPLE</h2><p class="tag">A collection of the things I learned from the people I met.</p><ol class="grid fit">${PP.map((p,i)=>`<li><i>${pad(i+1)}</i><span>${nm(p[0])}</span></li>`).join('')}</ol></div><span class="pn">05</span></div>`);
PP.forEach((_,i)=>{const k=i+1;pages.push(()=>textPage(k,4+2*k));pages.push(()=>artPage(k,5+2*k))});
pages.push(()=>`<div class="page left colo"><i class="edge"></i><div class="t"><p>The People Who Made Me<br>By Sania S<br><br>Selected lessons /<br>fragments / people</p></div><span class="pn">126</span></div>`);
pages.push(()=>`<div class="page right backc"><div class="scr">${scribble('#eeeef0')}</div></div>`);

function fitIn(r){r.querySelectorAll('.fit').forEach(b=>{const pg=b.closest('.page');let s=1;pg.style.setProperty('--s',1);const bad=()=>b.scrollHeight>b.clientHeight+1||b.scrollWidth>b.clientWidth+1;while(bad()&&s>.5){s-=.03;pg.style.setProperty('--s',s.toFixed(2))}})}
const root=$('#app');let n=0,leaves=[],MAXN=0,mode='';
const MQ=matchMedia('(max-width:420px)');
const nav=h=>`<div class="nav"><button id="prev" aria-label="Previous page">←</button><span class="hint"><span id="lbl"></span></span><button id="next" aria-label="Next page">→</button></div><div class="nav" style="font-size:10px;margin-top:-4px"><span class="hint">${h}</span></div>`;
function fill(j){const l=leaves[j];if(!l||l.dataset.f)return;l.dataset.f=1;l.children[0].innerHTML=pages[2*j]();if(l.children[1]&&pages[2*j+1])l.children[1].innerHTML=pages[2*j+1]();fitIn(l)}
function warm(){for(let j=Math.max(0,n-3);j<=Math.min(leaves.length-1,n+4);j++)fill(j)}
function curM(){const p=$('.pager'),w=p.querySelector('.pg').offsetWidth+16;return Math.max(0,Math.min(pages.length-1,Math.round(p.scrollLeft/w)))}
function fillM(i){const g=document.querySelectorAll('.pager .pg');for(let k=Math.max(0,i-3);k<=Math.min(g.length-1,i+3);k++){if(!g[k].dataset.f){g[k].dataset.f=1;g[k].innerHTML=pages[k]();fitIn(g[k])}}}
function label(){const el=$('#lbl');if(!el)return;if(mode==='m'){const i=curM();el.textContent=i===0?'Cover':i===pages.length-1?'Back cover':'Page '+(i+1)+' / '+pages.length;$('#prev').disabled=i<=0;$('#next').disabled=i>=pages.length-1;fillM(i)}
 else{el.textContent=n===0?'Cover':n===MAXN?'Back cover':'Pages '+(2*n)+'–'+(2*n+1);$('#prev').disabled=n===0;$('#next').disabled=n===MAXN;warm()}}
function setZ(){leaves.forEach((l,j)=>{if(l.dataset.busy)return;l.style.zIndex=j<n?j+1:300-j})}
function shift(){const b=$('.book');if(b)b.style.transform=n===0?'translateX(-25%)':'none'}
function go(d){if(mode==='m'){const p=$('.pager');p.scrollBy({left:d*(p.querySelector('.pg').offsetWidth+16),behavior:'smooth'});return}
 const j=d>0?n:n-1;if(j<0||j>=MAXN)return;const l=leaves[j];fill(j);l.dataset.busy=1;l.style.zIndex=300-j;l.classList.toggle('flipped',d>0);n+=d;shift();setTimeout(()=>{delete l.dataset.busy;setZ()},950);label()}
function buildBook(){mode='d';const nl=Math.ceil(pages.length/2);MAXN=nl-1;leaves=[];
 root.innerHTML='<div class="stage"><div class="book" id="book"></div></div>'+nav('Drag a page, tap its edge, or use ← →');const book=$('#book');
 for(let j=0;j<nl;j++){const l=document.createElement('div');l.className='leaf';l.innerHTML='<div class="face"></div>'+(pages[2*j+1]?'<div class="face back"></div>':'');book.appendChild(l);leaves.push(l)}
 n=0;setZ();shift();drag(book)}
function buildMobile(){mode='m';root.innerHTML='<div class="pager" tabindex="0" aria-label="Book pages">'+pages.map(()=>'<div class="pg"></div>').join('')+'</div>'+nav('Swipe to turn the page');
 const p=$('.pager');let t;p.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(label,60)},{passive:true});fillM(0)}
function drag(book){let st=null;
 book.addEventListener('pointerdown',e=>{const r=book.getBoundingClientRect(),right=e.clientX>r.left+r.width/2;
  if(right&&n>=MAXN||!right&&n<=0)return;st={x:e.clientX,right,j:right?n:n-1,p:0,moved:false,w:r.width/2,rx:e.clientX-r.left,rw:r.width};});
 window.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x;if(!st.moved&&Math.abs(dx)<8)return;
  if(!st.moved){st.moved=true;const l=leaves[st.j];fill(st.j);l.dataset.busy=1;l.style.zIndex=300-st.j;l.style.transition='none'}
  const p=Math.max(0,Math.min(1,st.right?-dx/st.w:dx/st.w));st.p=p;leaves[st.j].style.transform=`rotateY(${st.right?-180*p:-180+180*p}deg)`;});
 window.addEventListener('pointerup',()=>{if(!st)return;const s=st;st=null;const l=leaves[s.j];
  if(!s.moved){const edge=s.right?(s.rx>s.rw*.78):(s.rx<s.rw*.22);if(edge)go(s.right?1:-1);return}
  l.style.transition='';l.style.transform='';const commit=s.p>.3;
  if(commit){l.classList.toggle('flipped',s.right);n+=s.right?1:-1;shift()}
  setTimeout(()=>{delete l.dataset.busy;setZ()},950);label();});}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='prev')go(-1);if(b.id==='next')go(1)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){go(1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);e.preventDefault()}});
let lastMode=null,rt;
function init(){const m=MQ.matches?'m':'d';if(m!==lastMode){lastMode=m;(m==='m'?buildMobile:buildBook)();label()}else fitIn(document)}
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(init,150)});
init();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitIn(document));

</script>

</body></html>
